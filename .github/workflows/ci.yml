name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.x" }
      - run: uv sync --frozen --python 3.14
      - run: uv run ruff check dreampet tests
      # unit + graph (golden) + API + every scenario in scenarios/ with its assertions
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # route types (LayoutProps etc.) are generated into .next/, absent on a fresh checkout
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
