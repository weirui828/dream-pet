# Config for docker compose. Copy to config/dreampet.yaml and edit.
# Keys go in config/.secrets (KEY=value); reference them as ${KEY}.
data_dir: data
pet_id: pet
roles:
  # Cloud-keys profile example (uncomment and set keys):
  # explorer_llm:     { provider: anthropic, model: "<model>", api_key: ${ANTHROPIC_API_KEY} }
  # chat_llm:         { provider: anthropic, model: "<model>", api_key: ${ANTHROPIC_API_KEY} }
  # dreamer_llm:      { provider: anthropic, model: "<model>", api_key: ${ANTHROPIC_API_KEY}, temperature: 1.0 }
  # screenwriter_llm: { provider: openai, model: "<model>", api_key: ${OPENAI_API_KEY} }
  # embeddings:       { provider: openai, model: text-embedding-3-small, api_key: ${OPENAI_API_KEY}, dim: 1536 }
  # search:           { provider: searxng, url: http://searxng:8080 }
  # fetch:            { provider: trafilatura }
  # video:            { provider: fal, model: "<video-model>", api_key: ${FAL_KEY}, max_seconds: 15, usd_per_second: 0.08 }
  # image:            { provider: fal, model: fal-ai/flux/schnell, api_key: ${FAL_KEY} }
  #
  # Zero-cost local profile: Ollama + SearXNG + trafilatura + ComfyUI (open-weight Wan models)
  # explorer_llm: { provider: ollama, model: "<model>", url: http://host.docker.internal:11434 }
  # embeddings:   { provider: ollama, model: "<embed-model>", dim: 768, url: http://host.docker.internal:11434 }
  # video:        { provider: comfyui, url: http://host.docker.internal:8188, workflow: /config/wan_t2v_api.json }
  explorer_llm:     { provider: fake }
  chat_llm:         { provider: fake }
  dreamer_llm:      { provider: fake }
  screenwriter_llm: { provider: fake }
  embeddings:       { provider: fake, dim: 256 }
  search:           { provider: fake }
  fetch:            { provider: fake }
  video:            { provider: fake }
  image:            { provider: fake }
budgets:
  daily_usd_hard_cap: 2.50
  per_role_usd: { explorer_llm: 0.60, chat_llm: 0.40, dreamer_llm: 0.30, video: 1.00 }
api:
  host: 0.0.0.0
  port: 8000
  cors_origins: ["http://localhost:3000"]
